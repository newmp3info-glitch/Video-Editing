name: Build Android - Rakibul Video Studio

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find Gradle project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "RakibulVideoStudioMobile/settings.gradle.kts" ]; then
            PROJECT_DIR="RakibulVideoStudioMobile"
          else
            PROJECT_DIR="$(find . -maxdepth 4 -name settings.gradle.kts -print -quit | xargs -r dirname)"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle.kts not found."
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project directory: $PROJECT_DIR"

      - name: Verify project files
        shell: bash
        run: |
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "settings.gradle.kts: OK"
          echo "build.gradle.kts: OK"
          echo "app/build.gradle.kts: OK"

      - name: Show Gradle version
        shell: bash
        run: |
          gradle --version

      - name: Clean project
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" clean --stacktrace --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          gradle \
            -p "$PROJECT_DIR" \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Build release APK
        shell: bash
        run: |
          gradle \
            -p "$PROJECT_DIR" \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK files
        shell: bash
        run: |
          echo "Debug APK:"
          find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" -print

          echo "Release APK:"
          find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name "*.apk" -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Rakibul-Video-Studio-Android
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
